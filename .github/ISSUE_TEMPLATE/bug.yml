name: Bug report
description: Report a reproducible problem in the simulator, UI, documentation, or deployment.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed and expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the shared experiment link or PID, plant, effects, and simulation settings.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, console output, or numerical evidence
