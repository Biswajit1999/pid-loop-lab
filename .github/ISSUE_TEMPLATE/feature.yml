name: Feature proposal
description: Propose a focused improvement to the learning or engineering workflow.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Control or learning problem
      description: What cannot a user understand or accomplish today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the smallest useful interaction or output.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and references
      description: For numerical features, include equations, assumptions, and primary references.
